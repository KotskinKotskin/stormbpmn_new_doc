# Этот YML содержит переменные с BPMN иконками, которые подключаются через CDN CSS отсюда: https://github.com/bpmn-io/bpmn-font/blob/main/dist/css/bpmn.css
# Паттерн подключения такой: bpmn-icon-название-элемента-BPMN

bpmn:
  call_activity: '<span class="bpmn-icon-call-activity"></span> **Call Activity**'
  end_event: '<span class="bpmn-icon-end-event-none"></span> **Конечное событие**'
  task: '<span class="bpmn-icon-task-none"></span> **Задача**'
  subprocess_collapsed: '<span class="bpmn-icon-subprocess-collapsed"></span> **Свёрнутый подпроцесс**'
  space_tool: '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 2000 2000"><title xmlns="">space-tool</title><path fill="currentColor" fill-rule="evenodd" d="M731.39 100v1800h76V100zm466.824 0v1800h76V100zm401.938 574v216.91l-189.083 1.943v211.667h189.084V1326l325.916-326zm-1190.834 0L81.29 1000l328.03 326v-221.951h186.97V895.008H409.318z"/></svg> **Управление пространством**'