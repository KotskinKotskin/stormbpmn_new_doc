name: VuePress Production Build

'on':
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  prod_build:
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/prod build')) ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET_PROD_IMG: ${{ secrets.S3_BUCKET_PROD_IMG }}
      PROD_BUCKET: stormbpmn-doc-prod

    steps:
      - name: Authorize caller (admin or requested reviewer)
        id: auth
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            });

            const requestedReviewers = (pr.data.requested_reviewers || [])
              .map(u => (u.login || '').toLowerCase());
            const isRequestedReviewer = requestedReviewers.includes(commenter.toLowerCase());

            let isAdmin = false;
            let permission = 'none';
            try {
              const permResp = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: commenter,
              });
              permission = permResp.data.permission || 'none';
              isAdmin = ['admin', 'maintain'].includes(permission);
            } catch (e) {
              core.info(`Permission check failed for ${commenter}: ${e.message}`);
            }

            const allowed = isAdmin || isRequestedReviewer;
            core.info(`commenter=${commenter} permission=${permission} requested_reviewer=${isRequestedReviewer}`);

            if (!allowed) {
              core.setFailed(
                `Command '/prod build' is allowed only for repo admins or requested reviewers. ` +
                `commenter=${commenter}, permission=${permission}, requested_reviewer=${isRequestedReviewer}`
              );
            }

      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          [[ -n "$PR_NUMBER" ]] || { echo "PR number is empty"; exit 1; }
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: React on comment
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Checkout docs (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: stormbpmn_project/stormbpmn_new_doc
          fetch-depth: 0

      - name: Squash-merge PR into checked out docs
        if: github.event_name == 'issue_comment'
        working-directory: stormbpmn_project/stormbpmn_new_doc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "pull/${{ steps.pr.outputs.number }}/head:pr-head"
          if ! git merge --squash --no-commit pr-head; then
            echo "Squash merge conflict for PR #${{ steps.pr.outputs.number }}"
            exit 1
          fi
          git status --short

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          req=(
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            S3_ENDPOINT S3_REGION S3_BUCKET_PROD_IMG
          )
          for key in "${req[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Required secret/env is missing: $key"; exit 1; }
          done

      - name: Create working directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out_test_storage"
          mkdir -p "$GITHUB_WORKSPACE/output/vuepress_hope"
          mkdir -p "$GITHUB_WORKSPACE/site/vuepress"

      - name: Checkout VuePress Hope
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/vuepress_hope
          path: stormbpmn_project/stormbpmn_vuepress_hope

      - name: Normalize VuePress public media path
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_PATH="$GITHUB_WORKSPACE/stormbpmn_project/stormbpmn_vuepress_hope/src/.vuepress/public/media"
          if [[ -L "$MEDIA_PATH" ]]; then
            rm "$MEDIA_PATH"
          fi
          mkdir -p "$MEDIA_PATH"

      - name: Install VuePress dependencies
        working-directory: stormbpmn_project/stormbpmn_vuepress_hope
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Checkout UMDA
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/umda
          path: stormbpmn_project/umda

      - name: Patch UMDA PSD markdown regex
        working-directory: stormbpmn_project/umda
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("md_handler/md_handler.py")
          src = p.read_text(encoding="utf-8")

          old = "_PSD_LINK_RE = re.compile(r'(!\\[(.+?)\\]\\(\\{\\{\\s*([\\w.]+)\\s*\\}\\}\\))')"
          new = "_PSD_LINK_RE = re.compile(r'(!\\[([^\\]]*(?:\\[[^\\]]*\\][^\\]]*)*)\\]\\(\\{\\{\\s*([\\w.]+)\\s*\\}\\}\\))')"

          if new in src:
            print("UMDA regex already patched")
          elif old in src:
            p.write_text(src.replace(old, new, 1), encoding="utf-8")
            print("UMDA regex patched")
          else:
            raise SystemExit("Expected _PSD_LINK_RE pattern not found in md_handler.py")
          PY

      - name: Install UMDA dependencies
        working-directory: stormbpmn_project/umda
        shell: bash
        run: |
          set -euo pipefail
          uv venv .umda
          source .umda/bin/activate
          uv pip install -r requarements.txt

      - name: Prepare production umda.yml
        working-directory: stormbpmn_project/umda
        shell: bash
        run: |
          set -euo pipefail
          .umda/bin/python - <<'PY'
          import os
          import re
          from pathlib import Path
          import yaml

          ENV_RE = re.compile(r"\$\{([A-Za-z_][A-Za-z0-9_]*)(?::-([^}]*))?\}")

          def expand_env(s: str) -> str:
            def repl(match):
              name = match.group(1)
              default = match.group(2)
              value = os.getenv(name)
              if value:
                return value
              if default is not None:
                return default
              raise RuntimeError(f"Missing env var for prod umda.yml: {name}")
            return ENV_RE.sub(repl, s)

          def expand_obj(obj):
            if isinstance(obj, dict):
              return {k: expand_obj(v) for k, v in obj.items()}
            if isinstance(obj, list):
              return [expand_obj(v) for v in obj]
            if isinstance(obj, str):
              return expand_env(obj)
            return obj

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          docs = ws / "stormbpmn_project" / "stormbpmn_new_doc"
          vuepress = ws / "stormbpmn_project" / "stormbpmn_vuepress_hope"

          media_vars_path = docs / "vars" / "media.yml"
          if media_vars_path.exists():
            with media_vars_path.open("r", encoding="utf-8") as f:
              media_cfg = yaml.safe_load(f) or {}

            media_section = media_cfg.get("media", {})
            changed = False
            for section_name, section in media_section.items():
              if isinstance(section, dict):
                for key, value in list(section.items()):
                  if isinstance(value, str) and value.startswith("/root/stormbpmn_project/src_storage/"):
                    section[key] = "https://storage.yandexcloud.net/stormbpmn-psd-src/" + Path(value).name
                    changed = True

            if changed:
              with media_vars_path.open("w", encoding="utf-8") as f:
                yaml.safe_dump(media_cfg, f, allow_unicode=False, sort_keys=False)
              print(f"Normalized media vars for CI: {media_vars_path}")

          src = docs / "umda.yml"
          dst = docs / "umda.yml"

          with src.open("r", encoding="utf-8") as f:
            cfg = yaml.safe_load(f)

          cfg = expand_obj(cfg)
          cfg["config"]["doc_input"] = str(docs)

          vp = cfg["adapers"]["vuepress_hope"]
          vp["doc_output"] = str(ws / "output" / "vuepress_hope")
          vp["site_dir"] = str(ws / "site" / "vuepress")
          vp["base"] = "/"
          vp["vuepress_path"] = str(vuepress / "src" / ".vuepress")
          vp["nav"] = str(docs / "nav.yaml")
          vp["vars"] = str(docs / "vars.yaml")

          mk = cfg["adapers"].get("mkdocs")
          if mk:
            mk["doc_output"] = str(ws / "output" / "mkdocs")
            mk["site_dir"] = str(ws / "site" / "mkdocs")

          with dst.open("w", encoding="utf-8") as f:
            yaml.safe_dump(cfg, f, allow_unicode=False, sort_keys=False)

          print(f"Prepared {dst}")
          PY

      - name: Build docs with UMDA + VuePress
        working-directory: stormbpmn_project/umda
        shell: bash
        env:
          UMDA_YML: ${{ github.workspace }}/stormbpmn_project/stormbpmn_new_doc/umda.yml
        run: |
          set -euo pipefail
          source .umda/bin/activate
          bash vuepress_hope_build.sh

          if [[ -z "$(find "$GITHUB_WORKSPACE/site/vuepress" -type f -print -quit)" ]]; then
            echo "Build failed: site directory is empty"
            exit 1
          fi

      - name: Upload production bundle to S3
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --upgrade awscli
          fi

          aws s3 sync \
            "$GITHUB_WORKSPACE/site/vuepress/" \
            "s3://${PROD_BUCKET}/" \
            --delete \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$S3_REGION" \
            --no-progress

      - name: Comment success
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '✅ Production bundle built and uploaded.',
              '',
              `Bucket: s3://stormbpmn-doc-prod/`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: React success
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });
