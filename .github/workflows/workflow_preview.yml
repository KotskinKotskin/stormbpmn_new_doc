name: VuePress Preview (PR)

'on':
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to build preview for
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/vuepress build dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET_PROD_DOC: ${{ secrets.S3_BUCKET_PROD_DOC }}
      S3_BUCKET_PROD_IMG: ${{ secrets.S3_BUCKET_PROD_IMG }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      REMOTE_BASE_PATH: /var/www/html/stormbpmn

    steps:
      - name: Validate comment author (issue_comment)
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.comment.author_association }}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Trusted author association: ${{ github.event.comment.author_association }}"
              ;;
            *)
              echo "Refusing to run for untrusted author association: ${{ github.event.comment.author_association }}"
              exit 1
              ;;
          esac

      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          [[ -n "$PR_NUMBER" ]] || { echo "PR number is empty"; exit 1; }
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: React on comment
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Checkout docs (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: stormbpmn_project/stormbpmn_new_doc
          fetch-depth: 0

      - name: Squash-merge PR into checked out docs
        working-directory: stormbpmn_project/stormbpmn_new_doc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "pull/${{ steps.pr.outputs.number }}/head:pr-head"
          if ! git merge --squash --no-commit pr-head; then
            echo "Squash merge conflict for PR #${{ steps.pr.outputs.number }}"
            exit 1
          fi
          git status --short

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          req=(
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            S3_ENDPOINT S3_REGION S3_BUCKET_PROD_DOC S3_BUCKET_PROD_IMG
            SERVER_IP SSH_KEY
          )
          for key in "${req[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Required secret/env is missing: $key"; exit 1; }
          done

      - name: Create working directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out_test_storage"
          mkdir -p "$GITHUB_WORKSPACE/output/vuepress_hope"
          mkdir -p "$GITHUB_WORKSPACE/site/vuepress"

      - name: Checkout VuePress Hope
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/vuepress_hope
          path: stormbpmn_project/stormbpmn_vuepress_hope

      - name: Install VuePress dependencies
        working-directory: stormbpmn_project/stormbpmn_vuepress_hope
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: VuePress lifecheck
        working-directory: stormbpmn_project/stormbpmn_vuepress_hope
        shell: bash
        run: |
          set -euo pipefail
          npx vuepress-vite --version

      - name: Checkout UMDA
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/umda
          path: stormbpmn_project/umda

      - name: Install UMDA dependencies
        working-directory: stormbpmn_project/umda
        shell: bash
        run: |
          set -euo pipefail
          uv venv .umda
          source .umda/bin/activate
          uv pip install -r requarements.txt

      - name: UMDA lifecheck
        working-directory: stormbpmn_project/umda
        shell: bash
        run: |
          set -euo pipefail
          source .umda/bin/activate
          python - <<'PY'
          import os
          from pathlib import Path
          from psd_handler.psd_handler import PSDHandler
          from data_models.psd_config import PSDConfig

          out_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "out_test_storage"
          out_dir.mkdir(parents=True, exist_ok=True)
          psd_handler = PSDHandler(output_dir=str(out_dir))
          result = psd_handler.render(PSDConfig(
              psd_path="https://storage.yandexcloud.net/stormbpmn-psd-src/diagram.psd",
              base_layer="Account",
              Frames=["Account_btn", "Account_email"],
              Focuses=["Account"],
              Crops=[]
          ))
          psd_handler.terminate()
          print(f"Saved: {result}")
          PY

          if [[ -z "$(find "$GITHUB_WORKSPACE/out_test_storage" -type f -print -quit)" ]]; then
            echo "UMDA lifecheck failed: out_test_storage is empty"
            exit 1
          fi

      - name: Prepare CI umda.yml
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import yaml

          ENV_RE = re.compile(r"\$\{([A-Za-z_][A-Za-z0-9_]*)(?::-([^}]*))?\}")

          def expand_env(s: str) -> str:
            def repl(match):
              name = match.group(1)
              default = match.group(2)
              value = os.getenv(name)
              if value:
                return value
              if default is not None:
                return default
              raise RuntimeError(f"Missing env var for ci.umda.yml: {name}")
            return ENV_RE.sub(repl, s)

          def expand_obj(obj):
            if isinstance(obj, dict):
              return {k: expand_obj(v) for k, v in obj.items()}
            if isinstance(obj, list):
              return [expand_obj(v) for v in obj]
            if isinstance(obj, str):
              return expand_env(obj)
            return obj

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          docs = ws / "stormbpmn_project" / "stormbpmn_new_doc"
          vuepress = ws / "stormbpmn_project" / "stormbpmn_vuepress_hope"

          src = docs / "umda.yml"
          dst = ws / "stormbpmn_project" / "ci.umda.yml"

          with src.open("r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

            cfg = expand_obj(cfg)

          cfg["config"]["doc_input"] = str(docs)

          vp = cfg["adapers"]["vuepress_hope"]
          vp["doc_output"] = str(ws / "output" / "vuepress_hope")
          vp["site_dir"] = str(ws / "site" / "vuepress")
          vp["vuepress_path"] = str(vuepress / "src" / ".vuepress")
          vp["nav"] = str(docs / "nav.yaml")
          vp["vars"] = str(docs / "vars.yaml")

          mk = cfg["adapers"].get("mkdocs")
          if mk:
              mk["doc_output"] = str(ws / "output" / "mkdocs")
              mk["site_dir"] = str(ws / "site" / "mkdocs")

          with dst.open("w", encoding="utf-8") as f:
              yaml.safe_dump(cfg, f, allow_unicode=False, sort_keys=False)

          print(f"Prepared {dst}")
          PY

      - name: Build docs with UMDA + VuePress
        working-directory: stormbpmn_project/umda
        shell: bash
        env:
          UMDA_YML: ${{ github.workspace }}/stormbpmn_project/ci.umda.yml
        run: |
          set -euo pipefail
          source .umda/bin/activate
          bash vuepress_hope_build.sh

          if [[ -z "$(find "$GITHUB_WORKSPACE/site/vuepress" -type f -print -quit)" ]]; then
            echo "Build failed: site directory is empty"
            exit 1
          fi

      - name: Build preview metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date +'%Y%m%d-%H%M%S')"
          SHA_SHORT="${GITHUB_SHA::7}"
          PREVIEW_ID="vp-${NOW}-pr${{ steps.pr.outputs.number }}-${SHA_SHORT}"
          SSH_USER_SAFE="${SSH_USER:-root}"
          REMOTE_DIR="${REMOTE_BASE_PATH%/}/${PREVIEW_ID}"
          URL="https://${SERVER_IP}/stormbpmn/${PREVIEW_ID}/"

          echo "preview_id=${PREVIEW_ID}" >> "$GITHUB_OUTPUT"
          echo "remote_dir=${REMOTE_DIR}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "ssh_user=${SSH_USER_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Pack site bundle (zip)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site/vuepress"
          zip -r "$GITHUB_WORKSPACE/${{ steps.meta.outputs.preview_id }}.zip" .

      - name: Deploy preview via SCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          CFG

          REMOTE_ZIP="/tmp/${{ steps.meta.outputs.preview_id }}.zip"
          LOCAL_ZIP="$GITHUB_WORKSPACE/${{ steps.meta.outputs.preview_id }}.zip"

          ssh -i ~/.ssh/id_ed25519 "${{ steps.meta.outputs.ssh_user }}@${SERVER_IP}" \
            "mkdir -p '${{ steps.meta.outputs.remote_dir }}'"

          scp -i ~/.ssh/id_ed25519 "$LOCAL_ZIP" \
            "${{ steps.meta.outputs.ssh_user }}@${SERVER_IP}:${REMOTE_ZIP}"

          ssh -i ~/.ssh/id_ed25519 "${{ steps.meta.outputs.ssh_user }}@${SERVER_IP}" \
            "set -e; \
             if command -v unzip >/dev/null 2>&1; then \
               unzip -oq '${REMOTE_ZIP}' -d '${{ steps.meta.outputs.remote_dir }}'; \
             else \
               echo 'ERROR: unzip is not installed on remote host'; \
               exit 1; \
             fi; \
             rm -f '${REMOTE_ZIP}'"

      - name: Comment PR with preview URL
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '✅ Preview успешно собран и опубликован.',
              '',
              `Preview URL: ${{ steps.meta.outputs.preview_url }}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: React success
        if: success() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });
