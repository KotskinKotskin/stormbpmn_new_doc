name: VuePress Preview (PR)

'on':
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to build preview for
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # ponytail: gate для preview — валидация автора коммента и resolve PR number
  # Делается до вызова reusable build, чтобы не стартовать тяжёлую сборку зря
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/vuepress build dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      preview_id: ${{ steps.meta.outputs.preview_id }}
      preview_url: ${{ steps.meta.outputs.preview_url }}
      base_path: ${{ steps.meta.outputs.base_path }}
      media_base_url: ${{ steps.meta.outputs.media_base_url }}

    steps:
      - name: Validate comment author (issue_comment)
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.comment.author_association }}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Trusted author association: ${{ github.event.comment.author_association }}"
              ;;
            *)
              echo "Refusing to run for untrusted author association: ${{ github.event.comment.author_association }}"
              exit 1
              ;;
          esac

      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ inputs.pr_number }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          [[ -n "$PR_NUMBER" ]] || { echo "PR number is empty"; exit 1; }
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: React on comment
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Build preview metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # ponytail: stable per-PR id → повторные сборки перезаписывают ту же папку в gh-pages
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          PREVIEW_ID="pr-${PR_NUMBER}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="${OWNER,,}"
          PREVIEW_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/${PREVIEW_ID}/"
          BASE_PATH="/${REPO_NAME}/${PREVIEW_ID}/"
          # ponytail: полный https URL с /media в конце — Vite/Rollup пропускает
          # http(s) ссылки как есть; img_replacer отдаёт rel_path без media/ префикса
          MEDIA_BASE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/${PREVIEW_ID}/media"

          echo "preview_id=${PREVIEW_ID}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "media_base_url=${MEDIA_BASE_URL}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    uses: ./.github/workflows/workflow_build.yml
    with:
      pr_number: ${{ needs.gate.outputs.pr_number }}
      base_path: ${{ needs.gate.outputs.base_path }}
      media_base_url: ${{ needs.gate.outputs.media_base_url }}
      artifact_name: preview-bundle

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}

    steps:
      - name: Download site bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-bundle
          path: ${{ github.workspace }}

      - name: Unpack bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/vuepress"
          cd "$GITHUB_WORKSPACE/site/vuepress"
          unzip -qo "$GITHUB_WORKSPACE/stormbpmn-doc.zip"

      - name: Deploy to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          PR_DIR="pr-${PR_NUMBER}"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK_DIR="$GITHUB_WORKSPACE/gh-pages-deploy"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # ponytail: retry-цикл лечит гонку push между разными PR, пишущими в одну ветку gh-pages
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            rm -rf "$WORK_DIR"

            if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
              git clone --quiet --branch gh-pages "$REPO_URL" "$WORK_DIR"
            else
              echo "gh-pages branch does not exist, creating orphan branch"
              mkdir -p "$WORK_DIR"
              git -C "$WORK_DIR" init --quiet -b gh-pages
              git -C "$WORK_DIR" remote add origin "$REPO_URL"
            fi

            rm -rf "$WORK_DIR/$PR_DIR"
            mkdir -p "$WORK_DIR/$PR_DIR"
            cp -a "$GITHUB_WORKSPACE/site/vuepress/." "$WORK_DIR/$PR_DIR/"

            git -C "$WORK_DIR" add -A
            if git -C "$WORK_DIR" diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git -C "$WORK_DIR" commit --quiet -m "Deploy preview for PR #${PR_NUMBER}"

            if git -C "$WORK_DIR" push --quiet origin gh-pages 2>&1; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, will retry..."
          done

          echo "ERROR: Failed to push after 3 attempts"
          exit 1

  comment:
    needs: [gate, deploy]
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.gate.outputs.preview_url }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            let prTitle = '';
            try {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              prTitle = pr.data.title || '';
            } catch (e) {
              core.warning(`Could not fetch PR title: ${e.message}`);
            }
            // Экранируем [ и ] в тексте анкора
            const escaped = prTitle.replace(/[\[\]]/g, '\\$&');
            const body = [
              '✅ Preview успешно собран и опубликован в GitHub Pages.',
              '',
              `Preview: [${escaped} (#${prNumber})](${process.env.PREVIEW_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

      - name: React success
        if: success() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          [[ -n "$PR_NUMBER" ]] || { echo "PR number is empty"; exit 1; }
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Remove preview from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          PR_DIR="pr-${PR_NUMBER}"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK_DIR="$GITHUB_WORKSPACE/gh-pages-cleanup"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # ponytail: если ветки gh-pages или папки PR нет — нечего удалять, тихо выходим
          if ! git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch does not exist, nothing to clean"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            rm -rf "$WORK_DIR"
            git clone --quiet --branch gh-pages "$REPO_URL" "$WORK_DIR"

            if [[ ! -d "$WORK_DIR/$PR_DIR" ]]; then
              echo "Preview directory $PR_DIR does not exist, nothing to clean"
              exit 0
            fi

            git -C "$WORK_DIR" rm -rq "$PR_DIR"
            git -C "$WORK_DIR" commit --quiet -m "Remove preview for PR #${PR_NUMBER}"

            if git -C "$WORK_DIR" push --quiet origin gh-pages 2>&1; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, will retry..."
          done

          echo "ERROR: Failed to push after 3 attempts"
          exit 1

      - name: Comment cleanup
        if: always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { PR_NUMBER } = process.env;
            const body = `🗑 Preview для PR #${PR_NUMBER} удалён из GitHub Pages.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(PR_NUMBER, 10),
              body
            });
