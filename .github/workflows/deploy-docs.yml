name: StormBPMN Docs - Dev Preview via SCP

on:
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-preview:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/mkdocs build dev') &&
      github.event.issue.pull_request.head.ref != 'main' &&
      github.event.issue.pull_request.head.ref != 'master'

    runs-on: ubuntu-latest

    steps:
      - name: React 👀 on comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      # ────────────────────────────────────────────────
      # Checkout всех нужных репозиториев (как раньше)
      # ────────────────────────────────────────────────
      - name: Checkout PR branch (docs content)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.issue.pull_request.head.repo.full_name }}
          ref: ${{ github.event.issue.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: stormbpmn-docs

      - name: Checkout stormbpmn_mkdocs
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_mkdocs
          path: stormbpmn_mkdocs

      - name: Checkout custom styles
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_new_docs_css
          path: stormbpmn-docs-styles

      - name: Checkout cmddac adapter
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/cmddac
          path: cmddac

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true

      - name: Install MkDocs dependencies
        working-directory: ./stormbpmn_mkdocs
        run: uv sync --frozen

      # ────────────────────────────────────────────────
      # Запуск адаптера (отдельное venv + абсолютные пути)
      # ────────────────────────────────────────────────
      - name: Run cmddac adapter
        working-directory: ./cmddac/adapters/mkdocs
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

          DOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs"
          MKDOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn_mkdocs"
          STYLES_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs-styles"

          python main.py "$DOCS_DIR" "$MKDOCS_DIR" "$STYLES_DIR"

      # ────────────────────────────────────────────────
      # Сборка документации
      # ────────────────────────────────────────────────
      - name: Build MkDocs
        working-directory: ./stormbpmn_mkdocs
        run: uv run mkdocs build --strict --config-file out_conf.yaml

      # ────────────────────────────────────────────────
      # Генерация имени поддиректории
      # ────────────────────────────────────────────────
      - name: Generate preview folder name
        id: folder
        run: |
          PR_AUTHOR="${{ github.event.issue.user.login }}"
          PR_NUMBER="${{ github.event.issue.number }}"
          HEAD_SHA="${{ github.event.issue.pull_request.head.sha }}"
          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)

          NOW=$(date +"%d-%m-%H-%M")
          FOLDER_NAME="${NOW}-${PR_AUTHOR,,}-${PR_NUMBER}-${SHORT_SHA}"

          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "preview_url=https://${{ secrets.SSH_SERVER_IP }}/$FOLDER_NAME/" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────
      # Создание поддиректории на сервере + SCP копирование
      # ────────────────────────────────────────────────
      - name: Create remote folder and SCP deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "./stormbpmn_mkdocs/site/*"
          target: "${{ secrets.SSH_DOCS_PATH }}/${{ steps.folder.outputs.folder_name }}"
          strip_components: 0
          rm: false

      # Если хочешь очистить старую папку перед загрузкой — добавь отдельный ssh-шаг:
      # - name: Clean remote folder (optional)
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_SERVER_IP }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_KEY }}
      #     script: |
      #       rm -rf "${{ secrets.SSH_DOCS_PATH }}/${{ steps.folder.outputs.folder_name }}"

      # ────────────────────────────────────────────────
      # Успешный комментарий + ссылка
      # ────────────────────────────────────────────────
      - name: Success reaction + preview link
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

            const previewUrl = `${{ steps.folder.outputs.preview_url }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Документация успешно собрана и загружена на сервер!**\n\n**Preview:** ${previewUrl}\n(доступно по ссылке выше)`
            })