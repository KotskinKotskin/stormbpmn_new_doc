name: StormBPMN Docs - Dev Preview via SCP

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-preview:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/mkdocs build dev') &&
      github.event.issue.pull_request.head.ref != 'main' &&
      github.event.issue.pull_request.head.ref != 'master'

    runs-on: ubuntu-latest

    steps:
      - name: React 👀 on comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      # ────────────────────────────────────────────────
      # Checkout PR merged с main (симуляция после merge)
      # Работает для fork/non-fork автоматически
      # ────────────────────────────────────────────────

      - name: Checkout PR merged with main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: stormbpmn-docs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and checkout PR/merge ref
        working-directory: ./stormbpmn-docs
        run: |
          # Fetch GitHub-generated merge commit (PR head + base merged)
          git fetch origin "refs/pull/${{ github.event.issue.number }}/merge"
          
          # Checkout merge commit (если нет конфликтов)
          if git checkout -qf FETCH_HEAD; then
            echo "✅ Merged state ready. HEAD: $(git rev-parse HEAD)"
            git log -5 --oneline --graph
          else
            echo "❌ Merge conflict detected — preview cannot be built automatically."
            echo "Please resolve conflicts in the PR first."
            exit 1
          fi

      # ────────────────────────────────────────────────
      # Остальные шаги без изменений
      # ────────────────────────────────────────────────

      - name: Checkout stormbpmn_mkdocs
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_mkdocs
          path: stormbpmn_mkdocs

      - name: Checkout custom styles
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_new_docs_css
          path: stormbpmn-docs-styles

      - name: Checkout cmddac adapter
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/cmddac
          path: cmddac

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true

      - name: Install MkDocs dependencies
        working-directory: ./stormbpmn_mkdocs
        run: uv sync --frozen

      - name: Run cmddac adapter
        working-directory: ./cmddac/adapters/mkdocs
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

          DOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs"
          MKDOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn_mkdocs"
          STYLES_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs-styles"

          python main.py "$DOCS_DIR" "$MKDOCS_DIR" "$STYLES_DIR"

      - name: Build MkDocs
        working-directory: ./stormbpmn_mkdocs
        run: uv run mkdocs build --strict --config-file out_conf.yaml

      # ==================== ГЕНЕРАЦИЯ ИМЕНИ ПАПКИ ====================
      - name: Generate preview folder name
        id: folder
        run: |
          PR_AUTHOR="${{ github.event.issue.user.login }}"
          PR_NUMBER="${{ github.event.issue.number }}"
          HEAD_SHA="${{ github.event.issue.pull_request.head.sha }}"
          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          NOW=$(date +"%d-%m-%H-%M")
          FOLDER_NAME="${NOW}-${PR_AUTHOR,,}-${PR_NUMBER}-${SHORT_SHA}"
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "preview_url=https://${{ secrets.SSH_SERVER_IP }}/$FOLDER_NAME/" >> $GITHUB_OUTPUT

      # ==================== SETUP SSH + DEPLOY + FIX OWNERSHIP ====================
      - name: Setup SSH key and deploy via SCP + fix ownership for caddy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "StrictHostKeyChecking=no" >> ~/.ssh/config
          echo "UserKnownHostsFile=/dev/null" >> ~/.ssh/config

          REMOTE_PATH="${{ secrets.SSH_DOCS_PATH }}/${{ steps.folder.outputs.folder_name }}"

          echo "Deploying to: $REMOTE_PATH"

          # 1. Создаём папку
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }} \
            "mkdir -p $REMOTE_PATH"

          # 2. Копируем содержимое site/
          scp -i ~/.ssh/id_rsa -r ./stormbpmn_mkdocs/site/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }}:"$REMOTE_PATH/"

          # 3. Меняем владельца и права
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }} "
            chown -R caddy:caddy $REMOTE_PATH &&
            chmod -R u+rwX,go+rX $REMOTE_PATH &&
            find $REMOTE_PATH -type d -exec chmod 755 {} + &&
            find $REMOTE_PATH -type f -exec chmod 644 {} +
          "

          echo "Ownership fixed to caddy:caddy, permissions set"

      - name: Success reaction + preview link
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

            const previewUrl = `${{ steps.folder.outputs.preview_url }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Документация успешно собрана и загружена на сервер!**\n\n**Preview (PR + main merged):** ${previewUrl}\n(доступно по ссылке выше)`
            })
