name: StormBPMN Docs - Dev Build & Preview

on:
  issue_comment:
    types: [ created ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-dev:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/mkdocs build dev') &&
      github.event.issue.pull_request.head.ref != 'main' &&
      github.event.issue.pull_request.head.ref != 'master'

    runs-on: ubuntu-latest

    steps:
      - name: React 👀 on comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      - name: Checkout PR branch (docs content)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.issue.pull_request.head.repo.full_name }}
          ref: ${{ github.event.issue.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: stormbpmn-docs

      - name: Checkout stormbpmn_mkdocs
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_mkdocs
          path: stormbpmn_mkdocs

      - name: Checkout custom styles
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_new_docs_css
          path: stormbpmn-docs-styles

      - name: Checkout cmddac adapter
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/cmddac
          path: cmddac

      - name: Setup Python + uv (для MkDocs)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true

      - name: Install MkDocs dependencies
        working-directory: ./stormbpmn_mkdocs
        run: uv sync --frozen

      # ==================== ОТДЕЛЬНЫЙ ШАГ АДАПТЕРА (абсолютные пути) ====================
      - name: Run cmddac adapter (отдельное venv + absolute paths)
        working-directory: ./cmddac/adapters/mkdocs
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
          
          DOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs"
          MKDOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn_mkdocs"
          STYLES_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs-styles"
          
          echo "→ Передаём абсолютные пути:"
          echo "  docs_dir   = $DOCS_DIR"
          echo "  mkdocs_dir = $MKDOCS_DIR"
          echo "  styles_dir = $STYLES_DIR"
          
          python main.py "$DOCS_DIR" "$MKDOCS_DIR" "$STYLES_DIR"

      - name: Build MkDocs (используем out_conf.yaml)
        working-directory: ./stormbpmn_mkdocs
        run: uv run mkdocs build --strict --config-file out_conf.yaml

      - name: Deploy preview (только если НЕ форк)
        if: success() && !github.event.issue.pull_request.head.repo.fork
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stormbpmn_mkdocs/site
          publish_branch: gh-pages
          destination_dir: preview/pr-${{ github.event.issue.pull_request.number }}
          force_orphan: false

      - name: Success reaction + preview link (только если НЕ форк)
        if: success() && !github.event.issue.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/pr-${context.issue.number}/`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Документация успешно собрана!**\n\n**Preview:** ${previewUrl}\n(обновляется автоматически)`
            })