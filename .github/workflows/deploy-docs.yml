---
name: StormBPMN Docs - Dev Preview via SCP

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-preview:
    # 🔥 УСЛОВИЕ ЗАПУСКА: только для PR-комментариев с командой /mkdocs build dev
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/mkdocs build dev') &&
      github.event.issue.pull_request.head.ref != 'main' &&
      github.event.issue.pull_request.head.ref != 'master'

    runs-on: ubuntu-latest

    steps:
      # 👀 РЕАКЦИЯ НА КОММЕНТАРИЙ
      - name: React 👀 on comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            })

      # ═══════════════════════════════════════════════════════════════════════
      # 📥 CHECKOUT Документация (PR + main merge)
      # ═══════════════════════════════════════════════════════════════════════

      - name: 🔹 Checkout main branch docs content
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: stormbpmn-docs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Verify docs content (MD files)
        working-directory: ./stormbpmn-docs
        run: |
          MD_COUNT=$(find . -name '*.md' | wc -l)
          if [ "$MD_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No .md files found!"
            exit 1
          fi
          echo "✅ Docs OK: $MD_COUNT markdown files"

      - name: 🔹 Fetch PR merge ref
        id: pr-merge
        working-directory: ./stormbpmn-docs
        run: |
          git fetch origin "refs/pull/${{ github.event.issue.number }}/merge"
          if git checkout -qf FETCH_HEAD; then
            echo "✅ PR+main merged: $(git rev-parse HEAD)"
            echo "merge_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "❌ Merge conflict!"
            exit 1
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # 📦 MKDOCS THEME + DEPENDENCIES
      # ═══════════════════════════════════════════════════════════════════════

      - name: 🔹 Checkout stormbpmn_mkdocs (mkdocs.yml здесь!)
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_mkdocs
          path: stormbpmn_mkdocs

      - name: ✅ Verify MkDocs theme + config
        working-directory: ./stormbpmn_mkdocs
        run: |
          if [ ! -f "mkdocs.yml" ]; then
            echo "❌ ERROR: mkdocs.yml missing!"
            exit 1
          fi
          echo "✅ MkDocs OK: $(wc -l < mkdocs.yml) lines"

      - name: 🔹 Checkout CSS styles
        uses: actions/checkout@v4
        with:
          repository: KotskinKotskin/stormbpmn_new_docs_css
          path: stormbpmn-docs-styles

      - name: 🔹 Checkout cmddac adapter
        uses: actions/checkout@v4
        with:
          repository: Pseudolukian/cmddac
          path: cmddac

      - name: 🐍 Setup Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
          enable-cache: true

      - name: 📦 Install MkDocs dependencies
        working-directory: ./stormbpmn_mkdocs
        run: |
          uv sync --frozen
          echo "✅ MkDocs: $(uv run mkdocs --version)"

      # ═══════════════════════════════════════════════════════════════════════
      # ⚙️ CMDDAC: генерируем out_conf.yaml
      # ═══════════════════════════════════════════════════════════════════════

      - name: ⚙️ Run cmddac adapter
        id: cmddac
        working-directory: ./cmddac/adapters/mkdocs
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

          DOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs"
          MKDOCS_DIR="${GITHUB_WORKSPACE}/stormbpmn_mkdocs"
          STYLES_DIR="${GITHUB_WORKSPACE}/stormbpmn-docs-styles"

          python main.py "$DOCS_DIR" "$MKDOCS_DIR" "$STYLES_DIR"

          if [ -f "${MKDOCS_DIR}/out_conf.yaml" ]; then
            echo "✅ cmddac OK: $(wc -l < "${MKDOCS_DIR}/out_conf.yaml") lines"
            echo "cmddac_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ cmddac failed!"
            exit 1
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # 🧪 LOCAL SERVE TEST (улучшенный)
      # ═══════════════════════════════════════════════════════════════════════

      - name: 🧪 Test mkdocs serve --clean
        id: preview-test
        working-directory: ./stormbpmn_mkdocs
        timeout-minutes: 3
        run: |
          LOG_FILE="${GITHUB_WORKSPACE}/mkdocs.log"

          # Запуск в фоне + захват логов
          timeout 45s uv run mkdocs serve --clean -f out_conf.yaml > "$LOG_FILE" 2>&1 &
          MKDOCS_PID=$!

          # Ждём готовности (15 сек)
          for i in {1..8}; do
            sleep 2
            if curl -s http://localhost:8000/ > /dev/null 2>&1; then
              echo "✅ Serve OK (${i*2}s)"
              break
            fi
          done

          kill $MKDOCS_PID 2>/dev/null || true

          # Сохраняем warnings/errors
          ERRORS=$(grep -i "error\|failed" "$LOG_FILE" || true)
          WARNINGS=$(grep -i "warning" "$LOG_FILE" || true)

          echo "preview_errors<<EOF" >> $GITHUB_OUTPUT
          echo "$ERRORS"
          echo "EOF" >> $GITHUB_OUTPUT
          echo "preview_warnings<<EOF" >> $GITHUB_OUTPUT
          echo "$WARNINGS"
          echo "EOF" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════
      # 🔨 BUILD + VALIDATE SITE
      # ═══════════════════════════════════════════════════════════════════════

      - name: 🔨 Build MkDocs site
        id: build
        working-directory: ./stormbpmn_mkdocs
        run: |
          uv run mkdocs build --strict -f out_conf.yaml

          if [ -d "site" ] && [ "$(find site/ -type f | wc -l)" -gt 10 ]; then
            echo "✅ Build OK: $(find site/ -type f | wc -l) files"
            echo "build_size=$(du -sh site/)" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed!"
            exit 1
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # 📁 ИМЯ ПАПКИ + DEPLOY
      # ═══════════════════════════════════════════════════════════════════════

      - name: 📁 Generate preview folder name
        id: folder
        run: |
          PR_AUTHOR="${{ github.event.issue.user.login }}"
          PR_NUMBER="${{ github.event.issue.number }}"
          SHORT_SHA=$(echo "${{ steps.pr-merge.outputs.merge_sha }}" | cut -c1-7)
          NOW=$(date +"%d-%m-%H-%M")

          FOLDER_NAME="${NOW}-${PR_AUTHOR,,}-${PR_NUMBER}-${SHORT_SHA}"
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "preview_url=https://${{ secrets.SSH_SERVER_IP }}/$FOLDER_NAME/" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy via SCP
        id: deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config

          REMOTE_PATH="${{ secrets.SSH_DOCS_PATH }}/${{ steps.folder.outputs.folder_name }}"

          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }} \
            "mkdir -p '$REMOTE_PATH'"

          scp -i ~/.ssh/id_rsa -r ./stormbpmn_mkdocs/site/* \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }}:"$REMOTE_PATH/"

          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }} "
            if [ -f '$REMOTE_PATH/index.html' ]; then
              echo '✅ Deploy OK'
            else
              echo '❌ Deploy failed'
              exit 1
            fi
            chown -R caddy:caddy '$REMOTE_PATH'
            chmod -R u+rwX,go+rX '$REMOTE_PATH'
          "

      # ═══════════════════════════════════════════════════════════════════════
      # 🎉 УВЕДОМЛЕНИЕ С ЛОГАМИ
      # ═══════════════════════════════════════════════════════════════════════

      - name: 🎉 Success notification + preview link
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const errors = `${{ steps.preview-test.outputs.preview_errors }}`.trim();
            const warnings = `${{ steps.preview-test.outputs.preview_warnings }}`.trim();

            let issues = "";
            if (errors) {
              issues += `\n⚠️ **ERRORS:**\n\`\`\`\n${errors}\n\`\`\``;
            }
            if (warnings) {
              issues += `\n📋 **WARNINGS:**\n\`\`\`\n${warnings}\n\`\`\``;
            }

            const report = `✅ **StormBPMN Docs Preview готов!**

            **📊 Статус:**
            • ✅ PR merge: ${{ steps.pr-merge.outputs.merge_sha?.slice(0,7) }}
            • ✅ cmddac: OK
            • ✅ Serve test: PASSED${issues}
            • ✅ Build: ${{ steps.build.outputs.build_size }}
            • ✅ Deploy: OK

            **🔗 Preview:** ${{ steps.folder.outputs.preview_url }}
            **📁 Folder:** ${{ steps.folder.outputs.folder_name }}`;

            // Реакция + комментарий
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
