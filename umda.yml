config:
  doc_input: ${GITHUB_WORKSPACE}

adapers:
  mkdocs:
    doc_output: /root/output/mkdocs
    site_dir: /var/www/html/mkdocs
    mkdocs_path: /root/stormbpmn_project/stormbpmn_mkdocs
    config:
      output_config_name: stormbpmn
      options:
        docs_dir: /root/output/mkdocs
      sections:
        nav: /root/stormbpmn_project/stormbpmn_new_doc/nav.yaml
        extra: /root/stormbpmn_project/stormbpmn_new_doc/vars.yaml
    media:
      media_storage_output: /var/www/html/media
      media_base_url: /media
      image_extantion: webp

  vuepress_hope:
    doc_output: /root/output/vuepress_hope
    site_dir: /var/www/html/vuepress
    base: /
    vuepress_path: /root/stormbpmn_project/stormbpmn_vuepress_hope/src/.vuepress
    nav: /root/stormbpmn_project/stormbpmn_new_doc/nav.yaml
    vars: /root/stormbpmn_project/stormbpmn_new_doc/vars.yaml
    media:
      media_storage_output: /var/www/html/media
      media_base_url: /media
      image_extantion: webp
